name: Build SilentHub External ESP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CaptureLab/**'
      - '.github/workflows/capturelab-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p CaptureLab/SilentHubCaptureLab assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentHub-External-ESP-0.4.0-debug-apk
          path: CaptureLab/SilentHubCaptureLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14