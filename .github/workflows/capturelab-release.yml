name: Publish signed SilentHub External ESP release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (for example 1.0.0, 1.1.0, 1.5.0, 2.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate release signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silent-hub-release.jks"
          chmod 600 "$RUNNER_TEMP/silent-hub-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/silent-hub-release.jks" >> "$GITHUB_ENV"
      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="v${INPUT_VERSION}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "Use an exact stable version in the form 1.0.0, 1.1.0, 1.5.0 or 2.0.0." >&2
            exit 1
          fi
          VERSION_MAJOR="${BASH_REMATCH[1]}"
          VERSION_MINOR="${BASH_REMATCH[2]}"
          VERSION_PATCH="${BASH_REMATCH[3]}"
          if [ "$VERSION_PATCH" != "0" ]; then
            echo "SilentHub versions must use a zero patch component (for example 1.1.0 or 1.5.0)." >&2
            exit 1
          fi
          APP_VERSION_NAME="${RELEASE_TAG#v}"
          APP_VERSION_CODE=$((10#$VERSION_MAJOR * 1000000 + 10#$VERSION_MINOR * 1000 + 10#$VERSION_PATCH))
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if [ "$APP_VERSION_CODE" -le 5 ]; then
            echo "Release versionCode must be greater than the previous debug baseline (5)." >&2
            exit 1
          fi
          LATEST_TAG="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: SilentHub-Release-Workflow' https://api.github.com/repos/Silent-lua/Workspace/releases/latest | jq -r '.tag_name // empty' || true)"
          if [[ "$LATEST_TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            LATEST_CODE=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
            if [ "$APP_VERSION_CODE" -le "$LATEST_CODE" ]; then
              echo "Version $APP_VERSION_NAME must be higher than the latest published release $LATEST_TAG." >&2
              exit 1
            fi
          fi
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Publishing $APP_VERSION_NAME (Android versionCode $APP_VERSION_CODE)."

      - name: Build signed APK
        run: |
          gradle -p CaptureLab/SilentHubCaptureLab -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" assembleRelease
      - name: Prepare release assets
        run: |
          VERSION_NAME="$APP_VERSION_NAME"
          VERSION_CODE="$APP_VERSION_CODE"
          mkdir -p release-assets
          cp CaptureLab/SilentHubCaptureLab/app/build/outputs/apk/release/app-release.apk release-assets/SilentHub-External-ESP.apk
          cd release-assets
          sha256sum SilentHub-External-ESP.apk > SilentHub-External-ESP.apk.sha256
          cat > SilentHub-External-ESP.release.json <<JSON
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "mandatory": true,
            "minimumSupportedVersionCode": $VERSION_CODE,
            "changelog": "Premium UI, encrypted pairing, precise connection states, event-driven rendering and verified updates."
          }
          JSON
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: SilentHub External ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            release-assets/SilentHub-External-ESP.apk
            release-assets/SilentHub-External-ESP.apk.sha256
            release-assets/SilentHub-External-ESP.release.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}